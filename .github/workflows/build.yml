name: Build Android (APK & AAB)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Memungkinkan build manual dari tab Actions di GitHub

jobs:
  build:
    name: Build Signed APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Permanent Signing Keystore
        run: |
          echo "Restoring permanent release keystore..."
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            echo "Keystore restored from GitHub Secrets."
          elif [ -f "release.keystore.base64" ]; then
            base64 -d release.keystore.base64 > my-upload-key.jks
            echo "Keystore restored from repository release.keystore.base64."
          elif [ -f "my-upload-key.jks" ]; then
            echo "Using existing my-upload-key.jks in workspace."
          else
            echo "Generating fallback permanent keystore..."
            keytool -genkeypair -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass waliasuhcare2026 -keypass waliasuhcare2026 -dname "CN=Waliasuh Care, OU=SRT 1 Kediri, O=Sekolah Rakyat, L=Kediri, ST=Jawa Timur, C=ID"
          fi
          ls -la my-upload-key.jks

      - name: Prepare Environment File
        env:
          SECRET_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SECRET_SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ ! -f ".env" ]; then
            cp .env.example .env
          fi
          if [ -n "$SECRET_SUPABASE_URL" ]; then
            grep -q "^SUPABASE_URL=" .env && sed -i "s|^SUPABASE_URL=.*|SUPABASE_URL=$SECRET_SUPABASE_URL|" .env || echo "SUPABASE_URL=$SECRET_SUPABASE_URL" >> .env
          fi
          if [ -n "$SECRET_SUPABASE_KEY" ]; then
            grep -q "^SUPABASE_KEY=" .env && sed -i "s|^SUPABASE_KEY=.*|SUPABASE_KEY=$SECRET_SUPABASE_KEY|" .env || echo "SUPABASE_KEY=$SECRET_SUPABASE_KEY" >> .env
          fi
          sed -i 's/^SUPABASE_URL=$/SUPABASE_URL=https:\/\/your-project.supabase.co/' .env
          sed -i 's/^SUPABASE_KEY=$/SUPABASE_KEY=your_supabase_anon_key/' .env

      - name: Make Gradle Wrapper Executable
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          SECRET_STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          export STORE_PASSWORD="${SECRET_STORE_PASS:-waliasuhcare2026}"
          export KEY_PASSWORD="${SECRET_KEY_PASS:-waliasuhcare2026}"
          if [ -f "gradlew" ]; then
            ./gradlew :app:assembleRelease --stacktrace
          else
            gradle :app:assembleRelease --stacktrace
          fi

      - name: Build Release AAB (Android App Bundle)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          SECRET_STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          export STORE_PASSWORD="${SECRET_STORE_PASS:-waliasuhcare2026}"
          export KEY_PASSWORD="${SECRET_KEY_PASS:-waliasuhcare2026}"
          if [ -f "gradlew" ]; then
            ./gradlew :app:bundleRelease --stacktrace
          else
            gradle :app:bundleRelease --stacktrace
          fi

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaliasuhCare-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaliasuhCare-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
